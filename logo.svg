<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft ground shadow under the sphere -->
    <radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 3D Spherical Red Gradient (smooth lighting) -->
    <radialGradient id="sphere-red-3d" cx="35%" cy="35%" r="65%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#f87171" /> <!-- Soft highlight -->
      <stop offset="55%" stop-color="#dc2626" /> <!-- Primary red -->
      <stop offset="100%" stop-color="#7f1d1d" /> <!-- Shadow core -->
    </radialGradient>
    
    <!-- Mask to punch out the 4 slits from the right side of the capsule -->
    <mask id="capsule-slit-mask">
      <!-- Capsule base (visible white) -->
      <rect x="42" y="27" width="16" height="24" rx="8" fill="white" />
      
      <!-- 4 horizontal slits (cutout black) -->
      <!-- Starting at centerline (50) and exiting the right edge (58) -->
      <rect x="50" y="31.2" width="10" height="1.8" rx="0.9" fill="black" />
      <rect x="50" y="34.8" width="10" height="1.8" rx="0.9" fill="black" />
      <rect x="50" y="38.4" width="10" height="1.8" rx="0.9" fill="black" />
      <rect x="50" y="42.0" width="10" height="1.8" rx="0.9" fill="black" />
    </mask>

    <!-- Subtle drop shadow on the white mic elements -->
    <filter id="mic-depth-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.8" dy="1.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ground Shadow (adds floating 3D context) -->
  <ellipse cx="50" cy="85" rx="20" ry="3.5" fill="url(#ground-shadow)" />

  <!-- 3D Red Sphere -->
  <circle cx="50" cy="47" r="33" fill="url(#sphere-red-3d)" />

  <!-- White Mic with depth shadow (Matched to reference image) -->
  <g filter="url(#mic-depth-shadow)">
    <!-- Capsule with right-side slits -->
    <rect x="42" y="27" width="16" height="24" rx="8" fill="#ffffff" mask="url(#capsule-slit-mask)" />
    
    <!-- U-mount stand wrapping the capsule -->
    <path d="M 37 37 L 37 43 A 13 13 0 0 0 63 43 L 63 37" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Connector neck stem -->
    <line x1="50" y1="55" x2="50" y2="64" stroke="#ffffff" stroke-width="2.6" />
    
    <!-- Domed base plate -->
    <path d="M 38 68 Q 50 61 62 68 Z" fill="#ffffff" />
  </g>
</svg>
